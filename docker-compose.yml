
services:
  app:
    container_name: sms-nextjs-app
    build:
      context: .
      dockerfile: Dockerfile
    image: sms-nextjs-app:latest
    ports:
      - '${APP_EXPOSE_PORT}:3000'
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run dev"
    depends_on:
      - db
    networks:
      - sms-network
  db:
    image: postgres:18-alpine
    container_name: sms-postgres-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - '${DB_EXPOSE_PORT}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql:rw
    networks:
      - sms-network

networks:
  sms-network:
    driver: bridge

volumes:
  postgres-data:
